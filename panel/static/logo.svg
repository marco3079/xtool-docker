<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="xtool Painel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#shine)"/>
  <!-- the "x": two strokes, the rising one ends in an arrow (build → ship) -->
  <path d="M38 90 L82 46" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
  <path d="M66 40 H90 V64" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 40 L56 58 M72 74 L90 90" stroke="#fff" stroke-opacity=".9" stroke-width="15" stroke-linecap="round"/>
</svg>
